name: release

# Shared release pipeline for Zeepkist mods. Called from a mod's own release workflow.
#
#   version  latest stable tag + bump (+ stage iteration) → next version, fail early on bad setup
#   build    Windows: tests → publish Debug with that version → verify → pdb2mdb → zip
#   publish  tag + GitHub release on the exact commit that was built, zip attached
#   modio    stable releases only: upload the zip with the generated notes as changelog
on:
  workflow_call:
    inputs:
      bump:
        description: patch, minor or major (applied to the latest stable tag)
        required: true
        type: string
      stage:
        description: stable, alpha, beta or rc. Pre-releases are never uploaded to mod.io.
        required: false
        default: stable
        type: string
      mod-id:
        description: mod.io mod id. Required for stable releases.
        required: false
        default: 0
        type: number
      project:
        description: Path to the mod's .csproj. Defaults to the only .csproj in the repository root.
        required: false
        default: ''
        type: string
      test-projects:
        description: Test projects to run before publishing, one path per line
        required: false
        default: ''
        type: string
      pdb2mdb-extra:
        description: Extra DLL file names in the publish output to convert with pdb2mdb, one per line
        required: false
        default: ''
        type: string
      pre-build-script:
        description: PowerShell script (repo-relative) run after restore, e.g. a generated-code check
        required: false
        default: ''
        type: string
      verify-script:
        description: PowerShell script (repo-relative) run with the publish directory as its only argument
        required: false
        default: ''
        type: string
      dotnet-version:
        description: .NET SDK version(s) for actions/setup-dotnet
        required: false
        default: 8.0.x
        type: string
    secrets:
      MODIO_BEARER:
        required: false
    outputs:
      version:
        description: The version that was released
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  MONO_VERSION: 6.12.0.206
  # From the Mono.Mono 6.12.0.206 winget manifest (microsoft/winget-pkgs).
  MONO_MSI_SHA256: 4125F57D97CFA88257915EDC969E913DE198CD8E22396A29849037479A0AC368
  MONO_MSI_URL: https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.206-x64-0.msi
  DOTNET_NOLOGO: true

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      assembly-version: ${{ steps.next.outputs.assembly_version }}
      prerelease: ${{ steps.next.outputs.prerelease }}
      notes-start: ${{ steps.next.outputs.notes_start }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          STAGE: ${{ inputs.stage }}
          MOD_ID: ${{ inputs.mod-id }}
          MODIO_BEARER: ${{ secrets.MODIO_BEARER }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          case "$BUMP" in patch|minor|major) ;; *) fail "Unknown bump '$BUMP' (use patch, minor or major)" ;; esac
          case "$STAGE" in
            stable) stage_index=0 ;;
            alpha) stage_index=1 ;;
            beta) stage_index=2 ;;
            rc) stage_index=3 ;;
            *) fail "Unknown stage '$STAGE' (use stable, alpha, beta or rc)" ;;
          esac

          if [ "$STAGE" = stable ]; then
            [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] || fail "Stable releases run from $DEFAULT_BRANCH only (got $REF). Pre-releases can run from any branch."
            [ "$MOD_ID" != 0 ] || fail "Stable releases need the mod-id input (the mod.io mod id)."
            [ -n "$MODIO_BEARER" ] || fail "MODIO_BEARER secret is not available. Pass 'secrets: inherit' from the calling workflow."
          fi

          # Tags may or may not carry a leading v; compare on the stripped version, keep the real tag name.
          tags=$(git tag --list)
          stable_line=$(printf '%s\n' "$tags" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk '{ v = $0; sub(/^v/, "", v); print v, $0 }' | sort -V -k1,1 | tail -n 1 || true)
          [ -n "$stable_line" ] || fail "No stable tag (X.Y.Z) found. Create a starting tag for the current mod.io version first, e.g. 'git tag 1.0.0 <commit> && git push origin 1.0.0'."
          read -r stable stable_tag <<< "$stable_line"

          IFS=. read -r major minor patch <<< "$stable"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          base="$major.$minor.$patch"

          tag_exists() { git rev-parse -q --verify "refs/tags/$1" >/dev/null || git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }

          if [ "$STAGE" = stable ]; then
            version="$base"
            revision=0
            prerelease=false
            notes_start="$stable_tag"
          else
            escaped=$(printf '%s' "$base" | sed 's/\./\\./g')
            last_line=$(printf '%s\n' "$tags" | grep -E "^v?${escaped}-${STAGE}\.[0-9]+$" \
              | awk -F. '{ print $NF, $0 }' | sort -n -k1,1 | tail -n 1 || true)
            if [ -n "$last_line" ]; then
              read -r last _ <<< "$last_line"
            else
              last=0
            fi
            # Notes start at the newest pre-release of this version (any stage), else the last stable.
            newest_pre=$(printf '%s\n' "$tags" | grep -E "^v?${escaped}-(alpha|beta|rc)\.[0-9]+$" \
              | awk '{ split($0, p, "-"); split(p[2], s, "."); r = (s[1] == "alpha" ? 1 : s[1] == "beta" ? 2 : 3); print r * 100 + s[2], $0 }' \
              | sort -n -k1,1 | tail -n 1 | cut -d' ' -f2 || true)
            notes_start="${newest_pre:-$stable_tag}"
            iteration=$((last + 1))
            [ "$iteration" -le 99 ] || fail "Pre-release iteration would exceed 99 for $base-$STAGE."
            version="$base-$STAGE.$iteration"
            revision=$((stage_index * 100 + iteration))
            prerelease=true
          fi

          tag_exists "$version" && fail "Tag $version already exists."

          # Stable builds use the plain X.Y.Z; pre-releases get a fourth number the mod loader can order.
          if [ "$prerelease" = true ]; then assembly_version="$base.$revision"; else assembly_version="$base"; fi

          echo "Latest stable: $stable_tag → releasing $version (mod loader version $assembly_version)"
          {
            echo "version=$version"
            echo "assembly_version=$assembly_version"
            echo "prerelease=$prerelease"
            echo "notes_start=$notes_start"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-2025
    outputs:
      zip: ${{ steps.zip.outputs.name }}
      project: ${{ steps.project.outputs.path }}
    env:
      PACKAGE_DIR: C:\out\package
      ASSEMBLY_VERSION: ${{ needs.version.outputs.assembly-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Resolve project
        id: project
        shell: pwsh
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROJECT)) {
            $found = @(Get-ChildItem -Filter *.csproj -File)
            if ($found.Count -ne 1) { throw "Expected exactly one .csproj in the repository root, found $($found.Count). Set the 'project' input." }
            $path = $found[0].Name
          } else {
            $path = $env:PROJECT
          }
          if (-not (Test-Path -LiteralPath $path)) { throw "Project not found: $path" }
          [xml]$proj = Get-Content -Raw -LiteralPath $path
          $node = $proj.SelectSingleNode('/Project/PropertyGroup/AssemblyName')
          $name = if ($node) { $node.InnerText } else { $null }
          if ([string]::IsNullOrWhiteSpace($name)) { $name = [System.IO.Path]::GetFileNameWithoutExtension($path) }
          "path=$path" >> $env:GITHUB_OUTPUT
          "assembly=$name" >> $env:GITHUB_OUTPUT
          Write-Output "Project $path → $name.dll"

      - name: Restore
        shell: pwsh
        env:
          PROJECT: ${{ steps.project.outputs.path }}
        run: |
          dotnet restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }

      - name: Pre-build script
        if: inputs.pre-build-script != ''
        shell: pwsh
        env:
          SCRIPT: ${{ inputs.pre-build-script }}
        run: |
          & (Join-Path $PWD $env:SCRIPT)
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "$env:SCRIPT failed" }

      - name: Test
        if: inputs.test-projects != ''
        shell: pwsh
        env:
          TEST_PROJECTS: ${{ inputs.test-projects }}
        run: |
          foreach ($test in ($env:TEST_PROJECTS -split "`n" | ForEach-Object Trim | Where-Object { $_ })) {
            Write-Output "::group::$test"
            dotnet test $test -c Debug
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $test" }
            Write-Output "::endgroup::"
          }

      - name: Publish
        shell: pwsh
        env:
          PROJECT: ${{ steps.project.outputs.path }}
        run: |
          dotnet publish $env:PROJECT --no-restore -c Debug -o $env:PACKAGE_DIR "-p:Version=$env:ASSEMBLY_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }

      - name: Verify script
        if: inputs.verify-script != ''
        shell: pwsh
        env:
          SCRIPT: ${{ inputs.verify-script }}
        run: |
          & (Join-Path $PWD $env:SCRIPT) $env:PACKAGE_DIR
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "$env:SCRIPT failed" }

      - name: Restore cached Mono installer
        id: mono-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\mono-installer
          key: mono-msi-${{ env.MONO_VERSION }}-x64

      - name: Download Mono installer
        if: steps.mono-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mono-installer'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri $env:MONO_MSI_URL -OutFile (Join-Path $dir 'mono.msi')

      - name: Install Mono
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'mono-installer\mono.msi'
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          if ($hash -ne $env:MONO_MSI_SHA256) { throw "Mono installer hash mismatch: $hash" }
          $log = Join-Path $env:RUNNER_TEMP 'mono-install.log'
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*', "`"$log`"")
          if ($proc.ExitCode -notin 0, 3010) { Get-Content $log -Tail 50; throw "Mono install failed with exit code $($proc.ExitCode)" }
          if (-not (Test-Path 'C:\Program Files\Mono\bin\pdb2mdb.bat')) { throw 'pdb2mdb.bat not found after Mono install' }

      - name: PDB2MDB
        shell: pwsh
        env:
          ASSEMBLY: ${{ steps.project.outputs.assembly }}
          EXTRA: ${{ inputs.pdb2mdb-extra }}
        run: |
          $dlls = @("$env:ASSEMBLY.dll") + @($env:EXTRA -split "`n" | ForEach-Object Trim | Where-Object { $_ })
          foreach ($name in $dlls) {
            $dll = Join-Path $env:PACKAGE_DIR $name
            if (-not (Test-Path -LiteralPath $dll)) { throw "DLL not found in publish output: $name" }
            & 'C:\Program Files\Mono\bin\pdb2mdb.bat' $dll
            if ($LASTEXITCODE -ne 0) { throw "pdb2mdb failed for $name" }
            if (-not (Test-Path -LiteralPath "$dll.mdb")) { throw "pdb2mdb did not produce $name.mdb" }
          }

      - name: Zip build
        id: zip
        shell: pwsh
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $name = "$env:REPO_NAME-$env:VERSION.zip"
          $dst = Join-Path 'C:\out' $name
          Compress-Archive -Path "$env:PACKAGE_DIR\*" -DestinationPath $dst -Force
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$dst" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-package
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - name: Checkout built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: source

      # Stable: commit the version to the default branch and tag it, in one atomic push.
      # Pre-release: the version commit is only reachable through its tag, so the branch stays clean.
      - name: Commit version and push tag
        working-directory: source
        env:
          PROJECT: ${{ needs.build.outputs.project }}
          VERSION: ${{ needs.version.outputs.version }}
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assembly-version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          perl -0pi -e '
            my $v = $ENV{ASSEMBLY_VERSION};
            if (!s{<Version>[^<]*</Version>}{<Version>$v</Version>}) {
              s{(<PropertyGroup>(\r?\n)([ \t]*))}{$1<Version>$v</Version>$2$3} or die "No <PropertyGroup> to add <Version> to\n";
            }' "$PROJECT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "$PROJECT already has <Version>$ASSEMBLY_VERSION</Version>"
          else
            git commit -q -am "chore: release $VERSION"
          fi
          git tag "$VERSION"

          if [ "$PRERELEASE" = true ]; then
            git push origin "refs/tags/$VERSION"
          else
            git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$VERSION" \
              || { echo "::error::Could not push to $DEFAULT_BRANCH. It may have moved during the build (re-run the release), or a branch rule blocks the push."; exit 1; }
          fi

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-package
          path: package

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assembly-version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          NOTES_START: ${{ needs.version.outputs.notes-start }}
          ZIP: package/${{ needs.build.outputs.zip }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --verify-tag --title "$VERSION" --generate-notes --notes-start-tag "$NOTES_START")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$VERSION" "$ZIP" "${args[@]}"

          if [ "$PRERELEASE" = true ]; then
            body=$(gh release view "$VERSION" --repo "$REPO" --json body --jq .body)
            notes="Mod loader version: \`${ASSEMBLY_VERSION}\`"$'\n\n'"${body}"
            gh release edit "$VERSION" --repo "$REPO" --notes "$notes"
          fi

          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            gh release view "$VERSION" --repo "$REPO" --json body --jq .body
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  modio:
    needs: [version, build, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-26.04
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-package
          path: package

      - name: Upload mod to mod.io
        uses: Thundernerd/upload-mod-to-modio@306d470f2b096a40315bfda2e4cb39c7ef9e4de4 # v1.0.0
        with:
          bearer-token: ${{ secrets.MODIO_BEARER }}
          game-id: 3213 # Zeepkist
          mod-id: ${{ inputs.mod-id }}
          active: true
          changelog: ${{ needs.publish.outputs.notes }}
          file-path: package/${{ needs.build.outputs.zip }}
          version: ${{ needs.version.outputs.version }}
